name: Analytics checks
on:
  push:
    branches: [main, feature/transaction-forecasting-platform]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install analytics test dependencies
        run: python -m pip install "sqlalchemy>=2,<3" "python-dotenv>=1,<2" "pydantic>=2,<3" "pytest>=8,<10" "pandas>=2,<3" "numpy>=1.24,<3" "xgboost>=2,<4"
      - name: Compile analytics Python code
        run: python -m compileall -q app/analytics app/routers/analytics.py scripts tests
      - name: Unit tests
        run: python -m pytest -q tests/test_transaction_pipeline.py
